<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Horizon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #17212b);
    --bg2: var(--tg-theme-secondary-bg-color, #0e1621);
    --card: var(--tg-theme-section-bg-color, var(--bg));
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b9aa7);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --accent: var(--tg-theme-button-color, #5288c1);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --r: 14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg2);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg2);padding:12px 14px 0}
  .top{display:flex;align-items:center;gap:8px}
  .top h1{flex:1;margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
  .top small{display:block;font-size:13px;font-weight:400;color:var(--hint);margin-top:1px}
  .nav{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--text);
    font-size:18px;line-height:34px;cursor:pointer}
  .nav:disabled{opacity:.3}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;border-radius:999px;padding:6px 12px;background:var(--card);color:var(--text);
    font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .chip b{font-weight:600;color:var(--hint);margin-left:4px}
  .chip.on{background:var(--accent);color:var(--accent-text)}
  .chip.on b{color:inherit;opacity:.75}
  main{padding:4px 10px 28px}
  .sec{margin:16px 6px 8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--hint)}
  .card{background:var(--card);border-radius:var(--r);padding:13px 14px 12px;margin-bottom:8px}
  .meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--hint);margin-bottom:5px}
  .meta .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .score{margin-left:auto;flex:none;font-weight:600;font-size:12px;padding:1px 7px;border-radius:999px;
    background:color-mix(in srgb,var(--hint) 18%,transparent)}
  .score.hi{background:color-mix(in srgb,#e5534b 22%,transparent);color:#ff7b72}
  .card h2{margin:0 0 6px;font-size:16.5px;line-height:1.3;font-weight:650}
  .card p{margin:0}
  .more{margin-top:8px;border-top:1px solid var(--sep);padding-top:8px;display:none}
  .card.open .more{display:block}
  .more h3{margin:8px 0 2px;font-size:13px;font-weight:600;color:var(--hint)}
  .more h3:first-child{margin-top:0}
  .tags{margin-top:8px;font-size:13px;color:var(--link)}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;border:0;border-radius:10px;padding:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
    background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--link)}
  a{color:var(--link);text-decoration:none}
  .empty{text-align:center;color:var(--hint);padding:60px 20px}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="nav" id="prev" aria-label="Предыдущий день">‹</button>
    <h1 id="title">Horizon<small id="sub">загрузка…</small></h1>
    <button class="nav" id="next" aria-label="Следующий день">›</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {} }
const MONTHS = 'января февраля марта апреля мая июня июля августа сентября октября ноября декабря'.split(' ');
const $ = id => document.getElementById(id);
let dates = [], cur = null, data = null, filter = 'all';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" data-ext>$1</a>')
    .replace(/\n/g, '<br>');
}
const fmtDate = d => { const [y, m, dd] = d.split('-'); return `${+dd} ${MONTHS[m - 1]}`; };
const fmtTime = iso => { const t = new Date(iso); return t.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}); };
function srcLabel(it) {
  if (it.source_type === 'telegram') return '@' + it.source.replace(/^@/, '');
  if (it.source_type === 'reddit') return 'r/' + it.source.replace(/^r\//, '');
  if (it.source_type === 'hackernews') return 'Hacker News';
  return it.source || it.source_type;
}
function open(url) {
  url = url.replace('://telegram.me/', '://t.me/');
  if (!tg) return window.open(url, '_blank');
  if (/^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url); else tg.openLink(url);
}
const haptic = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

function card(it) {
  const primary = it.blocks.find(b => b.primary) || it.blocks[0];
  const rest = it.blocks.filter(b => b !== primary);
  const hi = (it.score || 0) >= 8;
  return `<article class="card" data-id="${esc(it.id)}">
    <div class="meta"><span class="src">${esc(srcLabel(it))} · ${fmtTime(it.published_at)}</span>
      ${it.score != null ? `<span class="score${hi ? ' hi' : ''}">${(+it.score).toFixed(1)}</span>` : ''}</div>
    <h2>${esc(it.title)}</h2>
    ${primary ? `<p>${md(primary.content)}</p>` : ''}
    ${rest.length || it.tags.length ? `<div class="more">
      ${rest.map(b => `<h3>${esc(b.title)}</h3><p>${md(b.content)}</p>`).join('')}
      ${it.tags.length ? `<div class="tags">${it.tags.map(t => '#' + esc(t.replace(/\s+/g, '_'))).join(' ')}</div>` : ''}
    </div>` : ''}
    <div class="row">
      ${rest.length || it.tags.length ? `<button class="btn" data-act="toggle">Подробнее</button>` : ''}
      <button class="btn" data-act="open" data-url="${esc(it.url)}">Открыть пост ↗</button>
    </div>
  </article>`;
}

function render() {
  const items = data.items;
  $('chips').innerHTML = [`<button class="chip${filter === 'all' ? ' on' : ''}" data-f="all">Все<b>${items.length}</b></button>`]
    .concat(data.sections.map(s => `<button class="chip${filter === s.id ? ' on' : ''}" data-f="${esc(s.id)}">${esc(s.name)}<b>${s.count}</b></button>`)).join('');
  if (!items.length) { $('list').innerHTML = '<div class="empty">Сегодня ничего важного не нашлось</div>'; return; }
  let html = '';
  for (const s of data.sections) {
    if (filter !== 'all' && filter !== s.id) continue;
    if (filter === 'all') html += `<div class="sec">${esc(s.name)}</div>`;
    html += items.filter(i => i.profile === s.id).map(card).join('');
  }
  $('list').innerHTML = html;
}

async function load(date) {
  cur = date;
  const i = dates.indexOf(date);
  $('prev').disabled = i >= dates.length - 1;
  $('next').disabled = i <= 0;
  $('sub').textContent = 'загрузка…';
  const r = await fetch(`data/${date}.json`, {cache: 'no-cache'});
  data = await r.json();
  $('title').firstChild.textContent = `Horizon · ${fmtDate(date)}`;
  $('sub').textContent = `${data.selected} важных из ${data.total} постов`;
  if (filter !== 'all' && !data.sections.some(s => s.id === filter)) filter = 'all';
  render();
  window.scrollTo(0, 0);
}

$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f; haptic(); render(); window.scrollTo(0, 0);
});
$('list').addEventListener('click', e => {
  const a = e.target.closest('a[data-ext]');
  if (a) { e.preventDefault(); return open(a.href); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'open') return open(b.dataset.url);
  const c = b.closest('.card'); c.classList.toggle('open'); haptic();
  b.textContent = c.classList.contains('open') ? 'Свернуть' : 'Подробнее';
});
$('prev').onclick = () => { haptic(); load(dates[dates.indexOf(cur) + 1]); };
$('next').onclick = () => { haptic(); load(dates[dates.indexOf(cur) - 1]); };

(async () => {
  try {
    dates = (await (await fetch('data/index.json', {cache: 'no-cache'})).json()).dates; // newest first
    const want = new URLSearchParams(location.search).get('d') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);
    await load(dates.includes(want) ? want : dates[0]);
  } catch (e) {
    $('sub').textContent = '';
    $('list').innerHTML = '<div class="empty">Дайджестов пока нет</div>';
  }
})();
</script>
</body>
</html>
